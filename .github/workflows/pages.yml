name: Publish guide only

on:
  push:
    branches: [main]
    paths:
      - opxy-jazz-guia-estilo-original.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the standalone guide
        run: |
          mkdir _public_guide
          cp opxy-jazz-guia-estilo-original.html _public_guide/index.html
          test "$(find _public_guide -type f | wc -l)" -eq 1
          test -f _public_guide/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public_guide
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
